name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-y-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Diagnóstico de acceso a la tienda real
        run: |
          r=$(curl -s -o /tmp/woo -w "%{http_code} %{content_type}" "https://humanstores.com/wp-json/wc/store/v1/products?per_page=1" || echo "sin-respuesta")
          echo "::notice title=Store API desde GitHub::$r $(head -c 60 /tmp/woo 2>/dev/null | tr -d '[:cntrl:]')"

  e2e:
    runs-on: ubuntu-latest
    needs: check-y-build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
